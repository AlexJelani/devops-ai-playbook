apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/AlexJelani/devops-ai-playbook.git'
    targetRevision: main
    path: gitops
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: boutique
  # Deploy every change to gitops/ on main automatically.
  # prune: delete resources removed from git; selfHeal: undo manual changes in the cluster.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
