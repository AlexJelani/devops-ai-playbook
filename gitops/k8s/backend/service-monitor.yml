apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: boutique-services
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - boutique
  selector:
    # All six backend services (each exposes /metrics on its "http" port)
    matchLabels:
      app.kubernetes.io/part-of: boutique
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
