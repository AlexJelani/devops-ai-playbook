# Backend services, mirroring docker-compose.yml (same names, ports and env).
# Each waits for Postgres before starting; images are filled in by deploy.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U postgres; do sleep 2; done"]
      containers:
        - name: gateway
          image: ECR_REGISTRY/gateway:IMAGE_TAG
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: development
            - name: PORT
              value: "3001"
            - name: AUTH_SERVICE_URL
              value: http://auth:3002
            - name: PRODUCTS_SERVICE_URL
              value: http://product-service:3003
            - name: ORDER_SERVICE_URL
              value: http://order-service:3004
            - name: ORDERS_SERVICE_URL
              value: http://orders:3005
            - name: USER_SERVICE_URL
              value: http://user-service:3006
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      initContainers:
        - name: wait-for-postgres
