name: Boutique CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Only app code; the manifest commit this workflow pushes (gitops/) must not re-trigger it
    paths:
      - projects/boutique-microservices/backend/**
      - projects/boutique-microservices/frontend/**
      - .github/workflows/ci.yml

# One run at a time, so manifest updates land in order
concurrency:
  group: boutique-ci
  cancel-in-progress: false

env:
  # Repository variable AWS_REGION overrides the default
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      # Let the other services finish when one fails
      fail-fast: false
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service
        include:
          - service: frontend
            # nginx image that serves the React build and proxies /api/ to the gateway
            dockerfile: Dockerfile.k8s

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Logs in and returns the registry (<account>.dkr.ecr.<region>.amazonaws.com)
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          if [ "${{ matrix.service }}" == "frontend" ]; then
            BUILD_PATH="projects/boutique-microservices/frontend"
          else
            BUILD_PATH="projects/boutique-microservices/backend/services/${{ matrix.service }}"
          fi

          echo "Building from $BUILD_PATH"

          docker build \
            -f $BUILD_PATH/${{ matrix.dockerfile || 'Dockerfile' }} \
            -t ${{ steps.ecr.outputs.registry }}/${{ matrix.service }}:$IMAGE_TAG \
          $BUILD_PATH

      - name: Push Docker Image
        run: |
          IMAGE_URI=${{ steps.ecr.outputs.registry }}/${{ matrix.service }}:$IMAGE_TAG
          echo "Pushing $IMAGE_URI"
          docker push $IMAGE_URI

  update-manifests:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update image tags in k8s manifests
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          # Replace the whole image reference, so placeholders like <AWS_ACCOUNT_ID> are fixed too
          update() {
            sed -i "s|image: .*/$1:.*|image: ${REGISTRY}/$1:${IMAGE_TAG}|" "$2"
            grep -q "image: ${REGISTRY}/$1:${IMAGE_TAG}" "$2" || { echo "No image line for $1 in $2"; exit 1; }
          }

          for SERVICE in auth gateway orders order-service product-service user-service; do
            update "$SERVICE" "gitops/k8s/backend/${SERVICE}.yml"
          done
          update frontend gitops/k8s/frontend/deployment.yml

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add gitops/k8s/
          git diff --staged --quiet && exit 0
          git commit -m "ci: update image tags to ${{ github.sha }}"
          # main may have moved while the images were building
          git pull --rebase
          git push
